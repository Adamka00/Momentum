plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
base { archivesName = 'momentum' }
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
loom {
    splitEnvironmentSourceSets()
    mods { momentum { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs { server { runDir 'run/server' }; client { runDir 'run/client' } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientCompileOnly 'com.terraformersmc:modmenu:21.0.0'
    if (providers.gradleProperty('withModMenu').map { it.toBoolean() }.getOrElse(false)) clientRuntimeOnly 'com.terraformersmc:modmenu:21.0.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }
jar { from('LICENSE') { rename { 'LICENSE_Momentum' } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'momentum-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}

// Exports Loom's resolved launch arguments for the two-process localhost test harness.
tasks.register('writeClientTestLaunch') {
    dependsOn 'compileGametestJava', 'processGametestResources', 'configureLaunch', 'downloadAssets'
    doLast {
        def clientRun = tasks.named('runClientGameTest').get()
        def target = layout.buildDirectory.file('client-test-launch.json').get().asFile
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            java: clientRun.javaLauncher.get().executablePath.asFile.absolutePath,
            jvmArgs: clientRun.allJvmArgs,
            classpath: clientRun.classpath.asPath,
            main: clientRun.mainClass.get(),
            args: clientRun.args
        ]))
    }
}
